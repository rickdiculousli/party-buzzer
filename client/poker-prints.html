<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Poker print generator</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      html, body { margin: 0; padding: 0; min-height: 0; background: transparent; }
      #app { --card-w: 252px; width: 256px; height: 356px; padding: 2px; }
      .poker-card { display: block; perspective: none; }
      .poker-card__shadow, .poker-card__shade { display: none; }
      .poker-card__turn, .poker-card__face, .poker-card__back { transform: none !important; transition: none; backface-visibility: visible; }
      .poker-card__face, .poker-card__back { box-shadow: inset 0 0 0 1px rgb(70 52 30 / 0.2), inset 0 1px 0 rgb(255 255 255 / 0.8); }
      [data-side="face"] .poker-card__back, [data-side="back"] .poker-card__face { display: none; }
    </style>
  </head>
  <body><div id="app"></div><script type="module" src="./anim/poker-prints.tsx"></script></body>
</html>
