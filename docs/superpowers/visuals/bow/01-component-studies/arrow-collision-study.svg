<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400" role="img" aria-labelledby="title desc">
  <title id="title">Bow minigame arrow collision response study</title>
  <desc id="desc">Three motion signatures for a lodged painted cedar arrow struck by another arrow.</desc>
  <defs>
    <filter id="cast" x="-30%" y="-100%" width="170%" height="300%">
      <feDropShadow dx="7" dy="9" stdDeviation="5" flood-color="#000" flood-opacity=".72"/>
    </filter>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f0e6"/><stop offset=".4" stop-color="#8a8073"/><stop offset=".75" stop-color="#d9d2c6"/><stop offset="1" stop-color="#554d44"/>
    </linearGradient>
    <style>
      .display { font-family: "Big Shoulders Display", "Arial Narrow", sans-serif; font-weight: 800; }
      .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
      .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .16em; fill: #8a8073; }
      .headline { font-size: 52px; fill: #f5f0e6; }
      .title { font-size: 31px; fill: #f5f0e6; }
      .body { font-size: 14px; fill: #b7ad9f; }
      .small { font-size: 12px; fill: #8a8073; }
      .label { font-size: 12px; font-weight: 600; letter-spacing: .1em; fill: #f5f0e6; }
      .rule { stroke: #2c2620; stroke-width: 1; }
      .shaft-under { fill: none; stroke: #2c2620; stroke-width: 13; stroke-linecap: round; }
      .shaft { fill: none; stroke: #a65f32; stroke-width: 8; stroke-linecap: round; }
      .ghost { fill: none; stroke: #8a8073; stroke-width: 2; stroke-dasharray: 5 7; opacity: .32; }
    </style>
    <g id="target-edge">
      <path d="M371 105C337 154 326 218 326 290C326 362 337 426 371 475" fill="#6a351d" stroke="#2c2620" stroke-width="18"/>
      <path d="M381 116C352 165 343 224 343 290C343 356 352 415 381 464" fill="none" stroke="#e7dfd0" stroke-width="13"/>
      <path d="M365 121C339 170 331 227 331 290C331 353 339 410 365 459" fill="none" stroke="#c9a227" stroke-width="2" stroke-dasharray="4 7" opacity=".7"/>
    </g>
    <g id="incoming">
      <path d="M14 52L91 7" stroke="#2c2620" stroke-width="9" stroke-linecap="round"/>
      <path d="M14 52L91 7" stroke="#7f858d" stroke-width="5" stroke-linecap="round"/>
      <path d="M84 0L106 -1L94 18L92 7Z" fill="url(#metal)" stroke="#2c2620" stroke-width="3"/>
      <rect x="0" y="48" width="18" height="8" rx="2" fill="#43d09d" transform="rotate(-30 9 52)"/>
    </g>
  </defs>

  <rect width="1400" height="1400" fill="#0b0a08"/>
  <rect width="1400" height="10" fill="#ffb454"/>
  <text x="42" y="62" class="mono eyebrow">BOW MINIGAME · MICROFEEDBACK STUDY 02</text>
  <text x="42" y="118" class="display headline">ARROW-ON-ARROW CLANK</text>
  <text x="42" y="151" class="mono body">The target grips the point. Only the lodged arrow's free tail stores and releases the collision energy.</text>
  <line x1="42" y1="180" x2="1358" y2="180" class="rule"/>
  <g transform="translate(42 208)">
    <text y="12" class="mono eyebrow">CONTROLLED VARIABLES</text>
    <text x="205" y="12" class="mono body">Same cedar arrow · target edge on right · same incoming glance · Ada lodged · Bo incoming</text>
  </g>

  <!-- A -->
  <g transform="translate(42 270)">
    <rect width="412" height="720" rx="5" fill="#16130f" stroke="#2c2620"/>
    <text x="24" y="37" class="mono eyebrow">A · HINGED SNAP</text>
    <text x="24" y="76" class="display title">THE WHOLE SHAFT TILTS</text>
    <text x="24" y="102" class="mono body">A single rigid kick around the lodged point.</text>
    <g transform="translate(0 165)">
      <path d="M44 290H334" class="ghost"/>
      <g filter="url(#cast)">
        <path d="M46 222L334 290" class="shaft-under"/><path d="M46 222L334 290" class="shaft"/>
        <rect x="17" y="215.5" width="31" height="13" rx="2" fill="#8f6cff" transform="rotate(13 48 222)"/>
        <path d="M326 276L360 290L326 304L336 290Z" fill="url(#metal)" stroke="#2c2620" stroke-width="5"/>
      </g>
      <g transform="translate(77 307)"><use href="#incoming"/></g>
      <use href="#target-edge"/>
    </g>
    <g transform="translate(24 622)">
      <text class="mono label">PIVOT</text><text x="84" class="mono body">At the arrowhead</text>
      <text y="30" class="mono label">FEEL</text><text x="84" y="30" class="mono body">Hard, quick, mechanical</text>
      <text y="60" class="mono label">READ</text><text x="84" y="60" class="mono body">More lever than spring</text>
    </g>
  </g>

  <!-- B -->
  <g transform="translate(494 270)">
    <rect width="412" height="720" rx="5" fill="#16130f" stroke="#2c2620"/>
    <text x="24" y="37" class="mono eyebrow">B · TAPERED TWANG</text>
    <g transform="translate(296 20)"><rect width="92" height="25" rx="2" fill="#c9a227"/><text x="46" y="17" text-anchor="middle" class="mono label" fill="#16130f">SELECTED</text></g>
    <text x="24" y="76" class="display title">THE FREE TAIL SINGS</text>
    <text x="24" y="102" class="mono body">Doorstop motion with a firm, quiet anchor.</text>
    <g transform="translate(0 165)">
      <path d="M44 290H334" class="ghost"/>
      <g filter="url(#cast)">
        <path d="M46 222C102 264 158 290 238 290H334" class="shaft-under"/><path d="M46 222C102 264 158 290 238 290H334" class="shaft"/>
        <rect x="17" y="215.5" width="31" height="13" rx="2" fill="#8f6cff" transform="rotate(28 48 222)"/>
        <path d="M326 276L360 290L326 304L336 290Z" fill="url(#metal)" stroke="#2c2620" stroke-width="5"/>
      </g>
      <g transform="translate(77 307)"><use href="#incoming"/></g>
      <use href="#target-edge"/>
    </g>
    <g transform="translate(24 622)">
      <text class="mono label">PIVOT</text><text x="84" class="mono body">Last third stays planted</text>
      <text y="30" class="mono label">FEEL</text><text x="84" y="30" class="mono body">Tactile, springy, controlled</text>
      <text y="60" class="mono label">READ</text><text x="84" y="60" class="mono body">Doorstop twang</text>
    </g>
  </g>

  <!-- C -->
  <g transform="translate(946 270)">
    <rect width="412" height="720" rx="5" fill="#16130f" stroke="#2c2620"/>
    <text x="24" y="37" class="mono eyebrow">C · TRAVELLING WHIP</text>
    <text x="24" y="76" class="display title">A WAVE RUNS THE SHAFT</text>
    <text x="24" y="102" class="mono body">A broad S-curve carries through the arrow.</text>
    <g transform="translate(0 165)">
      <path d="M44 290H334" class="ghost"/>
      <g filter="url(#cast)">
        <path d="M46 230C104 177 139 347 215 298C252 274 279 290 334 290" class="shaft-under"/><path d="M46 230C104 177 139 347 215 298C252 274 279 290 334 290" class="shaft"/>
        <rect x="17" y="223.5" width="31" height="13" rx="2" fill="#8f6cff" transform="rotate(-12 48 230)"/>
        <path d="M326 276L360 290L326 304L336 290Z" fill="url(#metal)" stroke="#2c2620" stroke-width="5"/>
      </g>
      <g transform="translate(77 307)"><use href="#incoming"/></g>
      <use href="#target-edge"/>
    </g>
    <g transform="translate(24 622)">
      <text class="mono label">PIVOT</text><text x="84" class="mono body">Wave crosses most of shaft</text>
      <text y="30" class="mono label">FEEL</text><text x="84" y="30" class="mono body">Elastic, broad, theatrical</text>
      <text y="60" class="mono label">READ</text><text x="84" y="60" class="mono body">Starts to resemble rope</text>
    </g>
  </g>

  <!-- B timing -->
  <line x1="42" y1="1030" x2="1358" y2="1030" class="rule"/>
  <text x="42" y="1072" class="mono eyebrow">SELECTED B TIMING · TAIL DISPLACEMENT ONLY</text>
  <text x="42" y="1112" class="display title">ONE HARD KICK, ONE SMALL OVERSHOOT, THEN A QUICK SETTLE.</text>
  <g transform="translate(58 1205)">
    <path d="M10 45H198" class="shaft-under"/><path d="M10 45H198" class="shaft"/><rect x="-12" y="38.5" width="24" height="13" rx="2" fill="#8f6cff"/><rect x="198" y="8" width="12" height="74" rx="3" fill="#6a351d" stroke="#2c2620" stroke-width="3"/>
    <text x="100" y="112" text-anchor="middle" class="mono small">REST · 0 MS</text>
  </g>
  <path d="M278 1250H326" class="rule"/><path d="M314 1243L326 1250L314 1257" fill="#2c2620"/>
  <g transform="translate(350 1205)">
    <path d="M10 2C48 28 91 45 142 45H198" class="shaft-under"/><path d="M10 2C48 28 91 45 142 45H198" class="shaft"/><rect x="-12" y="-4.5" width="24" height="13" rx="2" fill="#8f6cff" transform="rotate(30 10 2)"/><rect x="198" y="8" width="12" height="74" rx="3" fill="#6a351d" stroke="#2c2620" stroke-width="3"/>
    <path d="M55 84L90 59" stroke="#7f858d" stroke-width="4"/><path d="M83 55L98 53L91 67Z" fill="#b8bcc4"/>
    <text x="100" y="112" text-anchor="middle" class="mono small">KICK · 75 MS</text>
  </g>
  <path d="M570 1250H618" class="rule"/><path d="M606 1243L618 1250L606 1257" fill="#2c2620"/>
  <g transform="translate(642 1205)">
    <path d="M10 64C56 52 95 45 142 45H198" class="shaft-under"/><path d="M10 64C56 52 95 45 142 45H198" class="shaft"/><rect x="-12" y="57.5" width="24" height="13" rx="2" fill="#8f6cff" transform="rotate(-13 10 64)"/><rect x="198" y="8" width="12" height="74" rx="3" fill="#6a351d" stroke="#2c2620" stroke-width="3"/>
    <text x="100" y="112" text-anchor="middle" class="mono small">OVERSHOOT · 155 MS</text>
  </g>
  <path d="M862 1250H910" class="rule"/><path d="M898 1243L910 1250L898 1257" fill="#2c2620"/>
  <g transform="translate(934 1205)">
    <path d="M10 38C57 42 98 45 142 45H198" class="shaft-under"/><path d="M10 38C57 42 98 45 142 45H198" class="shaft"/><rect x="-12" y="31.5" width="24" height="13" rx="2" fill="#8f6cff" transform="rotate(5 10 38)"/><rect x="198" y="8" width="12" height="74" rx="3" fill="#6a351d" stroke="#2c2620" stroke-width="3"/>
    <text x="100" y="112" text-anchor="middle" class="mono small">RETURN · 235 MS</text>
  </g>
  <g transform="translate(1218 1205)">
    <path d="M10 45H128" class="shaft-under"/><path d="M10 45H128" class="shaft"/><rect x="-12" y="38.5" width="24" height="13" rx="2" fill="#8f6cff"/><rect x="128" y="8" width="12" height="74" rx="3" fill="#6a351d" stroke="#2c2620" stroke-width="3"/>
    <text x="66" y="112" text-anchor="middle" class="mono small">SETTLE · 360 MS</text>
  </g>
  <line x1="42" y1="1360" x2="1358" y2="1360" class="rule"/>
</svg>
